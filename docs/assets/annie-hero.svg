  <rect x="170" y="408" width="560" height="92" rx="20" fill="#101d2d" stroke="#8ebbe0" stroke-opacity=".25"/>
  <text x="196" y="436" fill="#5de8ff" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="2">ANNIE</text>
  <text x="196" y="463" fill="#f4f8fb" font-family="system-ui, sans-serif" font-size="15">Runtime facts stay visible. Metrics come from the model response.</text>
  <text x="196" y="486" fill="#6f8398" font-family="ui-monospace, monospace" font-size="9">105.7 tok/s  ·  3.2 s  ·  72 tok  ·  llama3.2</text>
