  <rect x="92" y="520" width="180" height="3" fill="#FF2A1A" opacity="0.85"/>
  <rect x="92" y="544" width="900" height="44" fill="#0A0B0D" stroke="#1E2227"/>
  <text x="112" y="572" fill="#6B7177" font-family="ui-monospace, monospace" font-size="16">&gt; talk to annie &</text>
