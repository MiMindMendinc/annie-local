<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Annie-5 local AI terminal interface">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121417"/>
      <stop offset="100%" stop-color="#0A0B0D"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#0A0B0D"/>
      <rect width="4" height="1" fill="#ffffff" opacity="0.03"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
