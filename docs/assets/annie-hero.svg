  <text x="92" y="84" fill="#E8E6E0" font-family="ui-monospace, monospace" font-size="22" font-weight="700" letter-spacing="6">ANNIE<tspan fill="#FF2A1A">-5</tspan></text>
  <text x="320" y="84" fill="#6B7177" font-family="ui-monospace, monospace" font-size="12" letter-spacing="3">CARE ENGINE · LOCAL · AIR-GAPPED</text>
