<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Annie Local Research Session</title>
  <desc id="desc">Dark local-first AI interface with a cyan orb and truthful runtime badges.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="10%" r="90%">
      <stop offset="0" stop-color="#10243b"/>
      <stop offset="0.45" stop-color="#07111f"/>
      <stop offset="1" stop-color="#02050a"/>
    </radialGradient>
    <radialGradient id="orb" cx="38%" cy="30%" r="70%">
      <stop offset="0" stop-color="#e8fdff"/>
      <stop offset="0.08" stop-color="#5de8ff"/>
      <stop offset="0.48" stop-color="#17566d"/>
      <stop offset="1" stop-color="#04090f"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="900" height="540" rx="20" fill="url(#bg)"/>
  <path d="M0 72h900" stroke="#8ebbe0" stroke-opacity=".18"/>
  <text x="34" y="32" fill="#5de8ff" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="3">ANNIE LOCAL</text>
  <text x="34" y="55" fill="#f4f8fb" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Research Session</text>
  <rect x="390" y="92" width="120" height="32" rx="16" fill="#5de8ff" fill-opacity=".08" stroke="#5de8ff" stroke-opacity=".55"/>
  <circle cx="409" cy="108" r="4" fill="#5de8ff"/>
  <text x="423" y="112" fill="#b8f4ff" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="2">IDLE</text>
  <circle cx="450" cy="230" r="102" fill="#5de8ff" fill-opacity=".12" filter="url(#glow)"/>
  <circle cx="450" cy="230" r="82" fill="none" stroke="#5de8ff" stroke-opacity=".32" stroke-dasharray="2 8"/>
  <circle cx="450" cy="230" r="62" fill="none" stroke="#5de8ff" stroke-opacity=".58"/>
  <circle cx="450" cy="230" r="45" fill="url(#orb)" stroke="#5de8ff"/>
  <text x="450" y="325" text-anchor="middle" fill="#9aadc0" font-family="system-ui, sans-serif" font-size="14">Ready for a private research session.</text>
  <g font-family="ui-monospace, monospace" font-size="10" font-weight="700">
    <rect x="240" y="348" width="128" height="34" rx="17" fill="#63dfa7" fill-opacity=".06" stroke="#63dfa7" stroke-opacity=".5"/>
    <circle cx="257" cy="365" r="4" fill="#63dfa7"/><text x="268" y="369" fill="#a8f3cf">MODEL: LOCAL</text>
    <rect x="380" y="348" width="152" height="34" rx="17" fill="#63dfa7" fill-opacity=".06" stroke="#63dfa7" stroke-opacity=".5"/>
    <circle cx="397" cy="365" r="4" fill="#63dfa7"/><text x="408" y="369" fill="#a8f3cf">MEMORY: LOCAL</text>
    <rect x="544" y="348" width="154" height="34" rx="17" fill="#ffd166" fill-opacity=".06" stroke="#ffd166" stroke-opacity=".5"/>
    <circle cx="561" cy="365" r="4" fill="#ffd166"/><text x="572" y="369" fill="#ffe4a1">NETWORK: UNVERIFIED</text>
