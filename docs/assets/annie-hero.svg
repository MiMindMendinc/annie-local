  <rect x="92" y="130" width="4" height="88" fill="#5A1410"/>
  <text x="112" y="158" fill="#E8E6E0" font-family="ui-monospace, monospace" font-size="18"><tspan fill="#FF2A1A" font-weight="700">ANNIE-5</tspan> resident. weights local. no wire out.</text>
  <text x="112" y="188" fill="#6B7177" font-family="ui-monospace, monospace" font-size="15">i keep what matters to you, and i'm in your corner.</text>
  <text x="112" y="218" fill="#6B7177" font-family="ui-monospace, monospace" font-size="15">say something</text>
  <rect x="112" y="250" width="64" height="18" fill="#FF2A1A" opacity="0.9"/>
  <text x="92" y="292" fill="#E8A317" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">YOU</text>
  <text x="176" y="292" fill="#CFCDC7" font-family="ui-monospace, monospace" font-size="16">help me plan the week</text>
  <text x="92" y="348" fill="#FF2A1A" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">ANNIE</text>
  <text x="176" y="348" fill="#E8E6E0" font-family="ui-monospace, monospace" font-size="16">Three things matter most. First  sleep tonight.</text>
  <text x="176" y="374" fill="#E8E6E0" font-family="ui-monospace, monospace" font-size="16">Second  ship the local build. Third  call someone real.</text>
