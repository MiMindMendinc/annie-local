<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoiceState • Offline</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09090b;
      --text: #ffffff;
      --muted: #a1a1aa;
      --panel: rgba(255, 255, 255, 0.08);
      --panel-border: #27272a;
      --black: #000000;
      --orange: #ff9500;
      --red: #ff3b30;
      --blue: #3b82f6;
      --blue-2: #1d4ed8;
      --green: #22c55e;
      --green-2: #16a34a;
      --yellow: #eab308;
      --yellow-2: #ca8a04;
      --violet: #7c3aed;
      --violet-2: #a855f7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }

    .wrap {
      max-width: 1024px;
      margin: 0 auto;
      padding: 32px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 32px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 5vw, 4rem);
      line-height: 1;
      letter-spacing: -0.055em;
      font-weight: 650;
    }

    .badge {
      color: #71717a;
      font-size: 0.75rem;
      vertical-align: super;
      letter-spacing: 0.08em;
      margin-left: 0.3rem;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .voice-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 0;
      cursor: pointer;
      padding: 12px 24px;
      border-radius: 18px;
      background: white;
      color: black;
      font-weight: 650;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .voice-button:hover { background: #e4e4e7; transform: translateY(-1px); }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }

    .orb-column {
      min-height: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .orb {
      width: 180px;
      height: 180px;
      border-radius: 999px;
      background: radial-gradient(circle at 40% 40%, #fff, var(--orange), var(--red));
      box-shadow: 0 0 80px var(--orange), 0 0 160px var(--red);
      transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    .orb.listening {
      box-shadow: 0 0 120px var(--blue), 0 0 240px var(--blue-2);
      animation: pulse-blue 1.5s infinite;
    }

    .orb.speaking {
      box-shadow: 0 0 120px var(--green), 0 0 240px var(--green-2);
      animation: pulse-green 0.8s infinite;
    }

    .orb.thinking {
      box-shadow: 0 0 120px var(--yellow), 0 0 240px var(--yellow-2);
      animation: pulse-yellow 1.2s infinite;
    }

    .orb-icon { font-size: 3.75rem; margin-bottom: 4px; }
    .orb-label { font-size: 0.72rem; letter-spacing: 3px; color: rgba(255,255,255,0.72); }

    .stats {
      margin-top: 24px;
      text-align: center;
      color: #a1a1aa;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
    }

    .glass {
      background: var(--panel);
      backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      padding: 24px;
    }

    .panel-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .status-pill {
      font-size: 0.65rem;
      padding: 4px 8px;
      background: rgba(16, 185, 129, 0.1);
      color: #34d399;
      border-radius: 999px;
    }

    .control { margin-bottom: 20px; }

    .control-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--orange);
    }

    .theme-row {
      display: flex;
      gap: 8px;
    }

    .theme-row button {
      flex: 1;
      border: 1px solid #3f3f46;
      border-radius: 16px;
      padding: 10px;
      cursor: pointer;
      color: white;
      background: #18181b;
      font-size: 0.8rem;
    }

    .theme-row button.light { background: white; color: black; }
    .theme-row button.neon { background: #7c3aed; border-color: #7c3aed; }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-top: 4px;
      margin-bottom: 20px;
    }

    .switch {
      width: 44px;
      height: 24px;
      border-radius: 999px;
      position: relative;
      display: inline-block;
      background: #3f3f46;
      cursor: pointer;
    }

    .switch input { display: none; }

    .switch span {
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      border-radius: 999px;
      background: white;
      transition: transform 0.2s ease;
    }

    .switch input:checked + span {
      transform: translateX(20px);
      background: #fff7ed;
    }

    .switch:has(input:checked) { background: var(--orange); }

    .log-wrap {
      border-top: 1px solid var(--panel-border);
      padding-top: 16px;
    }

    .log-label {
      color: #a1a1aa;
      font-size: 0.8rem;
      margin-bottom: 8px;
    }

    .command-log {
      height: 112px;
      overflow: auto;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 18px;
      padding: 12px;
      color: #6ee7b7;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.78rem;
    }

    @keyframes pulse-blue { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @keyframes pulse-green { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    @keyframes pulse-yellow { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }

    @media (max-width: 860px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .grid { grid-template-columns: 1fr; }
      .wrap { padding: 24px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>VoiceState <span class="badge">OFFLINE</span></h1>
        <p class="subtitle">Free • No API • Works anywhere your browser supports speech</p>
      </div>
      <button onclick="toggleVoice()" class="voice-button">
        <span id="mic-text">🎤 Start Voice</span>
      </button>
    </div>

    <div class="grid">
      <section class="orb-column">
        <div id="orb" onclick="manualTrigger()" class="orb" aria-label="Annie voice orb">
          <div>
            <div class="orb-icon">🌀</div>
            <div class="orb-label">ANNIE</div>
          </div>
        </div>
        <div class="stats">benchmark pending • browser voice demo</div>
      </section>

      <section class="glass">
        <div class="panel-title">
          <span>Live App State</span>
          <span class="status-pill">Voice Controlled</span>
        </div>

        <div class="control">
          <div class="control-row"><span>Orb Size</span><span id="orb-size-val">180px</span></div>
          <input type="range" id="orb-size" min="120" max="280" value="180" oninput="updateOrbSize()" />
        </div>

        <div class="control">
          <div class="control-row"><span>Theme</span></div>
          <div class="theme-row">
            <button onclick="setTheme('dark')">Dark</button>
            <button onclick="setTheme('light')" class="light">Light</button>
            <button onclick="setTheme('neon')" class="neon">Neon</button>
          </div>
        </div>

        <div class="switch-row">
          <div>Flagship Demo Mode</div>
          <label class="switch" aria-label="Flagship demo mode">
            <input type="checkbox" id="demo-toggle" onchange="toggleDemoMode()" />
            <span></span>
          </label>
        </div>

        <div class="log-wrap">
          <div class="log-label">Voice Command Log</div>
          <div id="command-log" class="command-log"></div>
        </div>
      </section>
    </div>
  </div>

  <script>
    let recognition;
    let isListening = false;
    const orb = document.getElementById('orb');
    const logEl = document.getElementById('command-log');

    function log(msg) {
      const d = document.createElement('div');
      d.textContent = `> ${msg}`;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
      if (logEl.children.length > 10) logEl.removeChild(logEl.children[0]);
    }

    function updateOrbSize() {
      const s = document.getElementById('orb-size').value;
      orb.style.width = s + 'px';
      orb.style.height = s + 'px';
      document.getElementById('orb-size-val').textContent = s + 'px';
    }

    function setTheme(t) {
      const b = document.body;
      if (t === 'dark') {
        b.style.background = '#09090b';
        b.style.color = '#fff';
      } else if (t === 'light') {
        b.style.background = '#f8f9fa';
        b.style.color = '#111';
      } else if (t === 'neon') {
        b.style.background = '#0a001f';
        b.style.color = '#fff';
        orb.style.boxShadow = '0 0 120px #a855f7, 0 0 240px #7c3aed';
      }
      log(`Theme → ${t}`);
    }

    function toggleDemoMode() {
      const on = document.getElementById('demo-toggle').checked;
      if (on) {
        orb.style.boxShadow = '0 0 160px #22c55e, 0 0 320px #16a34a';
        orb.style.animation = 'pulse-green 0.6s infinite';
        log('Demo mode ON — orb going wild');
      } else {
        orb.style.boxShadow = '0 0 80px #ff9500, 0 0 160px #ff3b30';
        orb.style.animation = '';
        log('Demo mode OFF');
      }
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) {
        log('Speech synthesis is not supported in this browser.');
        return;
      }
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.05;
      u.pitch = 1.1;
      speechSynthesis.speak(u);
      orb.classList.add('speaking');
      setTimeout(() => orb.classList.remove('speaking'), 1600);
      log(`Annie: ${text.substring(0, 55)}...`);
    }

    function handleCommand(transcript) {
      const cmd = transcript.toLowerCase();
      log(`You: ${transcript}`);
      orb.classList.add('thinking');
      setTimeout(() => orb.classList.remove('thinking'), 700);

      if (cmd.includes('bigger') || cmd.includes('larger')) {
        const s = document.getElementById('orb-size');
        s.value = Math.min(280, parseInt(s.value, 10) + 40);
        updateOrbSize();
        speak('Making the orb bigger.');
      } else if (cmd.includes('smaller') || cmd.includes('shrink')) {
        const s = document.getElementById('orb-size');
        s.value = Math.max(120, parseInt(s.value, 10) - 40);
        updateOrbSize();
        speak('Shrinking the orb.');
      } else if (cmd.includes('dark')) {
        setTheme('dark');
        speak('Dark theme on.');
      } else if (cmd.includes('light')) {
        setTheme('light');
        speak('Light theme activated.');
      } else if (cmd.includes('neon')) {
        setTheme('neon');
        speak('Neon mode engaged.');
      } else if (cmd.includes('demo') || cmd.includes('launch')) {
        document.getElementById('demo-toggle').checked = true;
        toggleDemoMode();
        speak('Launching full flagship demo. Orb going wild.');
      } else if (cmd.includes('clear')) {
        logEl.innerHTML = '';
        speak('Cleared.');
      } else if (cmd.includes('stats')) {
        speak('Benchmark stats are pending. Run the benchmark script on your local machine to measure real numbers.');
      } else {
        speak('Got it. What else should I control?');
      }
    }

    function toggleVoice() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        log('Speech recognition is not supported in this browser. Try Chrome or Edge.');
        speak('Speech recognition is not supported in this browser.');
        return;
      }

      if (!recognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.onresult = e => handleCommand(e.results[e.results.length - 1][0].transcript);
        recognition.onend = () => {
          isListening = false;
          document.getElementById('mic-text').textContent = '🎤 Start Voice';
          orb.classList.remove('listening');
        };
      }

      if (!isListening) {
        recognition.start();
        isListening = true;
        document.getElementById('mic-text').textContent = '⏹ Stop';
        orb.classList.add('listening');
      } else {
        recognition.stop();
      }
    }

    function manualTrigger() {
      if (!isListening) toggleVoice();
      else speak("I'm already listening.");
    }

    console.log('%c[VoiceState Offline] Ready — local demo loaded.', 'color:#666');
    document.getElementById('orb-size').oninput = updateOrbSize;
  </script>
</body>
</html>
