<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ANNIE // FABLE-5</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <b>ANNIE<span class="v">-5</span></b>
        <small>fully air-gapped · locally executed</small>
      </div>
      <div class="spacer"></div>
      <div class="status">
        <div class="pill air">
          <div class="dot on" id="airDot"></div>
          <span class="txt">air-gap</span>
        </div>
        <div class="pill">
          <div class="dot" id="engineDot"></div>
          <span class="txt" id="engineTxt">checking</span>
        </div>
        <button class="iconbtn" id="clearBtn" type="button" title="Clear conversation">clr</button>
      </div>
    </header>

    <main id="main">
      <div class="stream" id="stream">
        <div class="herald" id="herald">
          <div class="l1"><b>ANNIE-5</b> resident. weights local. no wire out.</div>
          <div class="l2">i keep what matters to you, and i'm in your corner.</div>
          <div class="l3">say something<span class="cursor"></span></div>
        </div>
      </div>
    </main>

    <div class="scanner" id="scanner"></div>

    <div class="prompt-wrap">
      <form class="prompt" id="chat-form">
        <textarea id="input" rows="1" placeholder="talk to annie…" autocomplete="off"></textarea>
        <button class="send" id="send" type="submit">Send</button>
      </form>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
