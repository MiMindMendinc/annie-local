services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: annie
      POSTGRES_PASSWORD: annie
      POSTGRES_DB: annie
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annie -d annie"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: annie
      MINIO_ROOT_PASSWORD: annie-secret
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
  # Pull a model after start: docker compose exec ollama ollama pull llama3.2

  api:
    build: .
    env_file:
      - .env
    environment:
      ANNIE_MODE: production
      AUTH_DISABLED: "false"
      DATABASE_URL: postgresql+asyncpg://annie:annie@postgres:5432/annie
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      OLLAMA_URL: http://ollama:11434
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - annie_local_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    command: arq annie.workers.tasks.WorkerSettings
    env_file:
      - .env
    environment:
      ANNIE_MODE: production
      DATABASE_URL: postgresql+asyncpg://annie:annie@postgres:5432/annie
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:
  annie_local_data:
