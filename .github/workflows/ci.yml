name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,prod]"

      - name: Run full test suite
        run: pytest -q

      - name: Run browser preference and locality tests
        run: node --test tests/ui_state.test.js

      - name: Run substrate canary gate
        run: bash scripts/canary_test.sh

  release-gate:
    name: Release gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate isolated CI-only secrets
        shell: bash
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 24)"
          } >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,prod]"

      - name: Install real local speech backend
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends espeak-ng

      - name: Run real WOPR speech self-test
        run: python -m annie.wopr_server --backend espeak-ng --self-test

      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .

      - name: Static security scan
        run: bandit -q -r src wopr_server.py --severity-level medium

      - name: Dependency vulnerability audit
        run: pip-audit --strict -r requirements-prod.lock

      - name: Build and inspect distributions
        run: |
          python -m build
          python - <<'PY'
          import sys
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          required = {
              "annie/ui/index.html",
              "annie/ui/app.js",
              "annie/ui/state.js",
              "annie/ui/styles.css",
              "annie/wopr_server.py",
          }
          with ZipFile(wheel) as archive:
              missing = required.difference(archive.namelist())
          if missing:
              raise SystemExit(f"wheel missing required assets: {sorted(missing)}")

          sys.path.insert(0, str(wheel))
          from annie import wopr_server

          if ".whl/" not in str(wopr_server.__file__):
              raise SystemExit(f"WOPR did not import from built wheel: {wopr_server.__file__}")
          PY

      - name: Validate JavaScript syntax
        run: |
          node --check src/annie/ui/state.js
          node --check src/annie/ui/api-client.js
          node --check src/annie/ui/validators.js
          node --check src/annie/ui/app.js
          node --test tests/ui_state.test.js

      - name: Validate Compose and container build
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker build --tag annie-local:ci .
