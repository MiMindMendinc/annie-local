[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "annie-local"
version = "0.3.0"
description = "Local-first AI research assistant with observable runtime privacy and memory controls."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Michigan MindMend Inc." }
]
keywords = [
  "local-ai",
  "voice-ai",
  "ollama",
  "offline-ai",
  "privacy-first",
  "ai-companion",
  "llm",
  "fastapi",
  "postgresql",
  "redis",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "email-validator>=2.1.0",
  "bleach>=6.1.0",
  "PyJWT>=2.13.0,<3",
  "bcrypt>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/MiMindMendinc/annie-local"
Repository = "https://github.com/MiMindMendinc/annie-local"
Issues = "https://github.com/MiMindMendinc/annie-local/issues"
Changelog = "https://github.com/MiMindMendinc/annie-local/blob/main/CHANGELOG.md"

[project.optional-dependencies]
prod = [
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "redis>=5.0.0",
  "arq>=0.26.0",
  "boto3>=1.34.0",
  "python-multipart>=0.0.9",
]
dev = [
  "bandit>=1.8.0",
  "build>=1.2.0",
  "httpx2>=2.10.0,<3",
  "pip-audit>=2.9.0",
  "pip-tools>=7.6.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.12.0",
]
demo = [
  "playwright>=1.55.0",
]

[project.scripts]
annie = "annie.cli:main"

[tool.setuptools.package-data]
annie = ["ui/*.html", "ui/*.js", "ui/*.css"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]
