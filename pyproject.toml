[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "annie-local"
version = "0.1.0"
description = "Private local voice AI companion with a reactive glowing orb UI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Michigan MindMend Inc." }
]
keywords = [
  "local-ai",
  "voice-ai",
  "ollama",
  "offline-ai",
  "privacy-first",
  "ai-companion",
  "llm",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
annie = "annie.cli:main"

[tool.setuptools.package-data]
annie = ["ui/*.html", "ui/*.js", "ui/*.css"]

[tool.setuptools.packages.find]
where = ["src"]
