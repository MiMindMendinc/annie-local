[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "annie-local"
version = "0.2.1"
description = "FABLE-5-class local AI companion — Ollama, memory, voice, zero cloud."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Michigan MindMend Inc." }
]
keywords = [
  "local-ai",
  "voice-ai",
  "ollama",
  "offline-ai",
  "privacy-first",
  "ai-companion",
  "llm",
  "fable-5",
  "fastapi",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/MiMindMendinc/annie-local"
Repository = "https://github.com/MiMindMendinc/annie-local"
Issues = "https://github.com/MiMindMendinc/annie-local/issues"
Changelog = "https://github.com/MiMindMendinc/annie-local/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
annie = "annie.cli:main"

[tool.setuptools.package-data]
annie = ["ui/*.html", "ui/*.js", "ui/*.css"]

[tool.setuptools.packages.find]
where = ["src"]
